name: Build A7 Kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Kernel branch"
        required: true
        type: choice
        options:
          - lineage-20
          - lineage-21
          - ksu-susfs-v2.3.0-L21
        default: lineage-20

  push:
    branches:
      - lineage-20
      - lineage-21
      - ksu-susfs-v2.3.0-L21

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 1
          submodules: recursive

      - name: Assert KSU submodule
        run: |
          test -f drivers/kernelsu/Kconfig || { echo "KSU submodule missing"; exit 1; }

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            cpio \
            gzip \
            zip \
            unzip \
            python3

      - name: Toolchain
        run: |
          echo "=== GCC ==="
          aarch64-linux-gnu-gcc --version | head -1

          echo "=== LD ==="
          aarch64-linux-gnu-ld --version | head -1

      - name: Configure
        run: |
          rm -rf out

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage-a7y17lte_defconfig

      - name: Build kernel
        run: |
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            Image.gz-dtb

      - name: Collect artifacts
        run: |
          mkdir -p artifacts

          cp out/arch/arm64/boot/Image.gz-dtb \
            artifacts/Image.gz-dtb

          find out/arch/arm64/boot/dts \
            -type f -name '*.dtb' \
            -exec cp {} artifacts/ \; 2>/dev/null || true

          {
            echo "Kernel: $(make -s O=out kernelversion)"
            echo "Branch: $(git branch --show-current)"
            echo "Commit: $(git rev-parse HEAD)"
          } > artifacts/build-info.txt

          echo "=== ARTIFACTS ==="
          ls -lh artifacts/

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: A7-${{ inputs.branch || github.ref_name }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

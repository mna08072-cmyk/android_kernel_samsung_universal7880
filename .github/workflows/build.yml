name: Build A7 Kernel

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "KernelSU ref (branch/tag/SHA; empty floats to master tip)"
        required: false
        type: string
        default: ""
      use_nomount:
        description: "Build with NoMount VFS hooks (off = plain KSU+SUSFS)"
        required: false
        type: boolean
        default: true
      nomount_ref:
        description: "NoMount ref (branch/tag/SHA; empty floats to master tip)"
        required: false
        type: string
        default: ""

  push:
    branches:
      - lineage-20
      - lineage-21
      - ksu-susfs-v2.3.0-L21
    paths-ignore:
      - "**/*.md"
      - "Documentation/**"

permissions:
  contents: read

# A newer push/dispatch on the same branch cancels the older in-flight build
# instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          submodules: recursive

      - name: Assert KSU submodule
        run: |
          test -f drivers/kernelsu/Kconfig || { echo "KSU submodule missing"; exit 1; }

      - name: Float KernelSU to tip (or ksu_ref)
        run: |
          set -eux
          KSU_REF="${{ inputs.ksu_ref }}"
          git -C KernelSU fetch -q origin master --depth=1
          if [ -n "$KSU_REF" ]; then
            git -C KernelSU fetch -q origin "$KSU_REF" --depth=1
            git -C KernelSU checkout -q "$KSU_REF"
          else
            git -C KernelSU checkout -q FETCH_HEAD
          fi
          KSU_SHA="$(git -C KernelSU rev-parse HEAD)"
          KSU_SHORT="$(git -C KernelSU rev-parse --short=8 HEAD)"
          echo "KSU_SHA=$KSU_SHA" >> "$GITHUB_ENV"
          echo "KSU_SHORT=$KSU_SHORT" >> "$GITHUB_ENV"
          echo "KernelSU at $KSU_SHA ($KSU_SHORT)"
          test -f drivers/kernelsu/Kconfig || { echo "KSU float broke drivers/kernelsu symlink"; exit 1; }

      - name: Setup NoMount (ephemeral, never committed)
        if: ${{ github.event_name == 'push' || inputs.use_nomount }}
        run: |
          set -eux
          NOMOUNT_REF="${{ inputs.nomount_ref }}"
          rm -rf NoMount fs/nomount
          if [ -n "$NOMOUNT_REF" ]; then
            for i in 1 2 3; do
              rm -rf NoMount
              git clone -q https://github.com/maxsteeel/nomount.git NoMount && break || { [ "$i" -eq 3 ] && exit 1; sleep 10; }
            done
            git -C NoMount fetch -q origin "$NOMOUNT_REF" --depth=1
            git -C NoMount checkout -q "$NOMOUNT_REF"
          else
            for i in 1 2 3; do
              rm -rf NoMount
              git clone -q --depth=1 --branch master https://github.com/maxsteeel/nomount.git NoMount && break || { [ "$i" -eq 3 ] && exit 1; sleep 10; }
            done
          fi
          NOMOUNT_SHA="$(git -C NoMount rev-parse HEAD)"
          NOMOUNT_SHORT="$(git -C NoMount rev-parse --short=8 HEAD)"
          echo "NOMOUNT_SHA=$NOMOUNT_SHA" >> "$GITHUB_ENV"
          echo "NOMOUNT_SHORT=$NOMOUNT_SHORT" >> "$GITHUB_ENV"
          echo "NoMount at $NOMOUNT_SHA ($NOMOUNT_SHORT)"
          ln -sfn ../NoMount/kernel/src fs/nomount
          test -f fs/nomount/nomount.c || { echo "fs/nomount symlink broken"; exit 1; }
          test -f fs/nomount/Kconfig || { echo "fs/nomount/Kconfig missing"; exit 1; }
          if ! grep -qF 'obj-$(CONFIG_NOMOUNT)' fs/Makefile; then
            printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> fs/Makefile
          fi
          if ! grep -qF 'source "fs/nomount/Kconfig"' fs/Kconfig; then
            awk '
              /^endmenu/ { last_match = NR }
              { lines[NR] = $0 }
              END {
                for (i = 1; i <= NR; i++) {
                  if (i == last_match) print "source \"fs/nomount/Kconfig\""
                  print lines[i]
                }
              }' fs/Kconfig > fs/Kconfig.tmp
            mv fs/Kconfig.tmp fs/Kconfig
          fi
          command -v patch >/dev/null || { echo "patch(1) missing"; exit 1; }
          for p in patches/nomount-3.18-*.patch; do
            [ -e "$p" ] || continue
            echo "Applying $p"
            patch -p1 --forward < "$p"
          done
          test -L fs/nomount
          grep -qF 'obj-$(CONFIG_NOMOUNT)' fs/Makefile
          grep -qF 'source "fs/nomount/Kconfig"' fs/Kconfig

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref_name }}-ksu${{ env.KSU_SHORT }}-nm${{ env.NOMOUNT_SHORT }}-${{ hashFiles('Makefile', 'fs/susfs.c', 'fs/susfs_ksu_glue.c', 'fs/susfs_supercall.c', 'KernelSU/kernel/**', 'patches/**') }}
          restore-keys: |
            ccache-${{ github.ref_name }}-ksu${{ env.KSU_SHORT }}-nm${{ env.NOMOUNT_SHORT }}-
            ccache-${{ github.ref_name }}-

      - name: Install toolchain (AOSP GCC 4.9, matches known-good reference)
        run: |
          set -eux
          for i in 1 2 3; do
            rm -rf /opt/aosp-gcc-4.9
            git clone -q --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 /opt/aosp-gcc-4.9 && break || { [ "$i" -eq 3 ] && exit 1; sleep 10; }
          done
          echo "/opt/aosp-gcc-4.9/bin" >> "$GITHUB_PATH"
          /opt/aosp-gcc-4.9/bin/aarch64-linux-android-gcc --version | head -1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            cpio \
            gzip \
            patch \
            zip \
            unzip \
            python3

      - name: Toolchain
        run: |
          echo "=== GCC ==="
          aarch64-linux-gnu-gcc --version | head -1

          echo "=== LD ==="
          aarch64-linux-gnu-ld --version | head -1

      - name: Configure
        run: |
          set -eux
          rm -rf out

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=/opt/aosp-gcc-4.9/bin/aarch64-linux-android- \
            lineage-a7y17lte_defconfig

          if [ -n "${NOMOUNT_SHA:-}" ]; then
            echo "NoMount enabled at ${NOMOUNT_SHA}; CONFIG_NOMOUNT must survive defconfig"
            grep -qx "CONFIG_NOMOUNT=y" out/.config || { echo "CONFIG_NOMOUNT lost after defconfig"; exit 1; }
          else
            echo "NoMount disabled by toggle; ensuring CONFIG_NOMOUNT stays off"
            if grep -q "CONFIG_NOMOUNT" out/.config; then
              ./scripts/config --file out/.config --disable CONFIG_NOMOUNT
              make O=out ARCH=arm64 olddefconfig
            fi
            if grep -qx "CONFIG_NOMOUNT=y" out/.config; then echo "CONFIG_NOMOUNT unexpectedly on"; exit 1; fi
          fi

      - name: Build kernel
        run: |
          export CC="ccache /opt/aosp-gcc-4.9/bin/aarch64-linux-android-gcc"
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE=2G
          # Stock-like build identity: scripts/mkcompile_h falls back to
          # whoami/hostname (runner@runnervmXXXX) baked into init/version.c
          # linux_banner — override with Samsung stock-style values instead.
          export KBUILD_BUILD_USER="dpi"
          export KBUILD_BUILD_HOST="SWHE4614"
          ccache -z || true

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=/opt/aosp-gcc-4.9/bin/aarch64-linux-android- \
            Image

          ccache -s || true

      - name: Verify kernel image
        run: |
          test -f out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

      - name: Verify KSU+SUSFS linked
        run: |
          nm out/fs/built-in.o | grep -q " T susfs_init$" || { echo "susfs_init missing in fs"; exit 1; }
          nm out/drivers/kernelsu/built-in.o | grep -q " T apply_kernelsu_rules$" || { echo "KSU core missing"; exit 1; }
          grep -qx "CONFIG_KSU=y" out/.config
          grep -qx "CONFIG_KSU_SUSFS=y" out/.config
          echo "KSU+SUSFS symbols verified"
          echo "KSU ${KSU_SHA:?KSU_SHA unset} (${KSU_SHORT:?KSU_SHORT unset})"
          if grep -qx "CONFIG_NOMOUNT=y" out/.config; then
            test -f out/fs/nomount/built-in.o || { echo "NoMount built-in.o missing"; exit 1; }
            nm out/fs/nomount/built-in.o | grep -q " nomount_init$" || { echo "NoMount symbols missing"; exit 1; }
            echo "NoMount symbols verified (${NOMOUNT_SHA:?NOMOUNT_SHA unset} / ${NOMOUNT_SHORT:?NOMOUNT_SHORT unset})"
          else
            echo "CONFIG_NOMOUNT not set; skipping NoMount symbol check"
            test ! -e fs/nomount || { echo "stray fs/nomount with CONFIG_NOMOUNT off"; exit 1; }
          fi

      - name: Prepare AnyKernel3
        run: |
          rm -rf anykernel

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

          cp ak-template/anykernel.sh anykernel/anykernel.sh

          cp out/arch/arm64/boot/Image \
            anykernel/Image

          rm -rf anykernel/.git anykernel/.github

          NOMOUNT_STATUS="disabled"
          if [ -n "${NOMOUNT_SHA:-}" ]; then
            NOMOUNT_STATUS="${NOMOUNT_SHA:?NOMOUNT_SHA unset} (${NOMOUNT_SHORT:?NOMOUNT_SHORT unset})"
          fi

          cat > anykernel/versions.txt <<EOF
          branch=${{ github.ref_name }}
          run=${{ github.run_number }}
          ksu_sha=${KSU_SHA:?KSU_SHA unset}
          ksu_short=${KSU_SHORT:?KSU_SHORT unset}
          nomount=${NOMOUNT_STATUS}
          EOF
          cat anykernel/versions.txt

          ZIP_NAME="A7-${{ github.ref_name }}-${{ github.run_number }}-ksu${KSU_SHORT:?}-nm${NOMOUNT_SHORT:-off}-AnyKernel.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "$ZIP_NAME"

          cd anykernel

          zip -r9 \
            "../$ZIP_NAME" .

          cd ..

          IMG_SIZE="$(stat -c '%s' anykernel/Image)"
          {
            echo "## A7 Kernel Build"
            echo ""
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Run: ${{ github.run_number }} (head ${{ github.sha }})"
            echo "- KernelSU: ${KSU_SHA:?} (${KSU_SHORT:?})"
            echo "- NoMount: ${NOMOUNT_STATUS}"
            echo "- Image: ${IMG_SIZE} bytes"
            echo "- Artifact: ${ZIP_NAME:?}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect artifacts
        run: |
          ls -lh "${ZIP_NAME:?ZIP_NAME unset}"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30

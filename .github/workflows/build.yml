name: Build A7 Kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Kernel branch"
        required: true
        type: choice
        options:
          - lineage-20
          - lineage-21
          - ksu-susfs-v2.3.0-L21
        default: lineage-20

  push:
    branches:
      - lineage-20
      - lineage-21
      - ksu-susfs-v2.3.0-L21

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 1
          submodules: recursive

      - name: Assert KSU submodule
        run: |
          test -f drivers/kernelsu/Kconfig || { echo "KSU submodule missing"; exit 1; }

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.branch || github.ref_name }}-${{ hashFiles('Makefile', 'fs/susfs.c', 'fs/susfs_ksu_glue.c', 'drivers/kernelsu/**') }}
          restore-keys: |
            ccache-${{ inputs.branch || github.ref_name }}-

      - name: Install toolchain (AOSP GCC 4.9, matches known-good reference)
        run: |
          git clone -q --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 /opt/aosp-gcc-4.9
          echo "/opt/aosp-gcc-4.9/bin" >> "$GITHUB_PATH"
          /opt/aosp-gcc-4.9/bin/aarch64-linux-android-gcc --version | head -1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            cpio \
            gzip \
            zip \
            unzip \
            python3

      - name: Toolchain
        run: |
          echo "=== GCC ==="
          aarch64-linux-gnu-gcc --version | head -1

          echo "=== LD ==="
          aarch64-linux-gnu-ld --version | head -1

      - name: Configure
        run: |
          rm -rf out

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=/opt/aosp-gcc-4.9/bin/aarch64-linux-android- \
            lineage-a7y17lte_defconfig

      - name: Build kernel
        run: |
          export CC="ccache /opt/aosp-gcc-4.9/bin/aarch64-linux-android-gcc"
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE=2G
          ccache -z || true

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=/opt/aosp-gcc-4.9/bin/aarch64-linux-android- \
            Image

          ccache -s || true

      - name: Verify kernel image
        run: |
          test -f out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

      - name: Verify KSU+SUSFS linked
        run: |
          nm out/fs/built-in.o | grep -q " T susfs_init$" || { echo "susfs_init missing in fs"; exit 1; }
          nm out/drivers/kernelsu/built-in.o | grep -q " T apply_kernelsu_rules$" || { echo "KSU core missing"; exit 1; }
          grep -qx "CONFIG_KSU=y" out/.config
          grep -qx "CONFIG_KSU_SUSFS=y" out/.config
          echo "KSU+SUSFS symbols verified"

      - name: Prepare AnyKernel3
        run: |
          rm -rf anykernel

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

          cp ak-template/anykernel.sh anykernel/anykernel.sh

          cp out/arch/arm64/boot/Image \
            anykernel/Image

          rm -rf anykernel/.git anykernel/.github

          cd anykernel

          zip -r9 \
            ../A7-${{ inputs.branch || github.ref_name }}-${{ github.run_number }}-AnyKernel.zip .

          cd ..

      - name: Collect artifacts
        run: |
          ls -lh A7-${{ inputs.branch || github.ref_name }}-${{ github.run_number }}-AnyKernel.zip

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: A7-${{ inputs.branch || github.ref_name }}-${{ github.run_number }}-AnyKernel
          path: A7-${{ inputs.branch || github.ref_name }}-${{ github.run_number }}-AnyKernel.zip
          if-no-files-found: error
          retention-days: 30

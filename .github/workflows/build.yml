name: Build A7 Kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Kernel branch"
        required: true
        type: choice
        options:
          - lineage-20
          - lineage-21
        default: lineage-20

  push:
    branches:
      - lineage-20
      - lineage-21

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            cpio \
            gzip \
            zip \
            unzip \
            python3 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Download Android GCC 4.9
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$HOME/aarch64-gcc"

          echo "CROSS_COMPILE=$HOME/aarch64-gcc/bin/aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "$HOME/aarch64-gcc/bin" >> "$GITHUB_PATH"

      - name: Show build information
        run: |
          echo "=== BRANCH ==="
          git branch --show-current

          echo "=== COMMIT ==="
          git log -1 --oneline

          echo "=== KERNEL ==="
          make -s kernelversion

          echo "=== TOOLCHAIN ==="
          "$HOME/aarch64-gcc/bin/aarch64-linux-android-gcc" --version | head -1

      - name: Configure kernel
        run: |
          rm -rf out

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            lineage-a7y17lte_defconfig

      - name: Build kernel
        run: |
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            Image.gz-dtb

      - name: Collect kernel
        run: |
          mkdir -p artifacts

          cp out/arch/arm64/boot/Image.gz-dtb \
            artifacts/Image.gz-dtb

          find out/arch/arm64/boot/dts \
            -type f -name '*.dtb' \
            -exec cp {} artifacts/ \; 2>/dev/null || true

          echo "Kernel version: $(make -s O=out kernelversion)" \
            > artifacts/build-info.txt

          echo "Branch: $(git branch --show-current)" \
            >> artifacts/build-info.txt

          echo "Commit: $(git rev-parse HEAD)" \
            >> artifacts/build-info.txt

          echo "=== ARTIFACTS ==="
          ls -lh artifacts/

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: A7-${{ inputs.branch || github.ref_name }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
